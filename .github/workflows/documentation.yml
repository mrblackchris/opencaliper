name: Doxygen documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Generate API reference and drawings
        run: |
          status=0
          doxygen Doxyfile || status=$?
          if [ -s docs-api/warnings.log ]; then
            echo "Doxygen emitted warnings:"
            cat docs-api/warnings.log
            status=1
          fi
          if [ ! -f docs-api/html/index.html ]; then
            echo "Doxygen did not generate docs-api/html/index.html"
            status=1
          fi
          exit "$status"
      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencaliper-documentation-diagnostics
          path: docs-api/warnings.log
          if-no-files-found: ignore
      - name: Upload browsable HTML reference
        uses: actions/upload-artifact@v4
        with:
          name: opencaliper-api-reference
          path: docs-api/html/
          if-no-files-found: error
